<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work Safe 매뉴얼</title>
<link rel="icon" href="./assets/icon/app-icon-64.png" type="image/png" />
<style>
  :root {
    --paper: #f6f4ef;
    --surface: #ffffff;
    --ink: #1c2333;
    --ink-muted: #5c6472;
    --line: #e3ded2;
    --navy: #16233f;
    --accent: #b5601c;
    --accent-soft: #f4e3ce;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14161c;
      --surface: #1b1e26;
      --ink: #ecebe6;
      --ink-muted: #a6a9b4;
      --line: #2c303b;
      --navy: #b9c4de;
      --accent: #e2954f;
      --accent-soft: #3a2c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 560px; width: 100%; padding: 40px 24px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
  }
  .eyebrow::before { content: ""; width: 18px; height: 1.5px; background: var(--accent); }
  h1 { font-size: clamp(24px, 4vw, 30px); font-weight: 800; letter-spacing: -0.01em; margin: 0 0 10px; }
  p.lead { color: var(--ink-muted); font-size: 15px; margin: 0 0 28px; line-height: 1.6; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    text-decoration: none; color: var(--ink);
  }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 700; font-size: 15px; }
  a.card .desc { font-size: 12.5px; color: var(--ink-muted); margin-top: 3px; }
  a.card .arrow { color: var(--accent); font-weight: 800; flex: none; }
  .card.disabled {
    opacity: 0.5; pointer-events: none;
  }
  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">Work Safe</span>
    <h1>매뉴얼 모음</h1>
    <p class="lead">Work Safe 서비스의 화면별 사용법을 정리한 문서입니다.</p>
    <div class="cards">
      <a class="card" href="./admin-manual.html">
        <div>
          <div class="title">관리자 매뉴얼<span class="badge">교육용</span></div>
          <div class="desc">기관 담당자를 위한 관리자 콘솔 사용 안내 + 대면 교육 진행 스크립트</div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="card disabled" href="#">
        <div>
          <div class="title">참여자 매뉴얼</div>
          <div class="desc">준비 중</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>
  </div>
</body>
</html>
